<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Divyansh Arora | Contact</title>
  <style>
    :root {
      --bg: #f5f3ef;
      --card: #ffffff;
      --text: #1d1d1f;
      --muted: #6b6b70;
      --accent: #2f5bea;
      --border: #e4e1da;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121214;
        --card: #1c1c1f;
        --text: #f2f2f3;
        --muted: #a0a0a8;
        --accent: #7b9bff;
        --border: #2c2c31;
      }
    }
    * { box-sizing: border-box; margin: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 40px 32px;
      text-align: center;
    }
    .avatar {
      width: 88px;
      height: 88px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      display: grid;
      place-items: center;
      font-size: 36px;
      font-weight: 600;
    }
    h1 { font-size: 28px; font-weight: 650; }
    .role { color: var(--muted); margin-top: 6px; }
    ul { list-style: none; padding: 0; margin-top: 28px; text-align: left; }
    li + li { margin-top: 10px; }
    a.item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 16px;
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      text-decoration: none;
      transition: border-color .15s, transform .15s;
    }
    a.item:hover { border-color: var(--accent); transform: translateY(-1px); }
    .label { font-size: 12px; color: var(--muted); display: block; }
    .value { font-size: 15px; word-break: break-all; }
    .icon { font-size: 20px; width: 24px; text-align: center; }
    footer { margin-top: 28px; font-size: 13px; color: var(--muted); }
  </style>
</head>
<body>
  <main class="card">
    <div class="avatar">DA</div>
    <h1>Divyansh Arora</h1>
    <p class="role">Sales · Zoxima</p>

    <ul>
      <li>
        <a class="item" href="mailto:Div.arora@zoxima.com">
          <span class="icon">✉️</span>
          <span><span class="label">Email</span><span class="value">Div.arora@zoxima.com</span></span>
        </a>
      </li>
      <li>
        <a class="item" href="tel:+918799714396">
          <span class="icon">📞</span>
          <span><span class="label">Phone</span><span class="value">+91 87997 14396</span></span>
        </a>
      </li>
      <li>
        <a class="item" href="https://wa.me/918799714396" target="_blank" rel="noopener">
          <span class="icon">💬</span>
          <span><span class="label">WhatsApp</span><span class="value">Chat on WhatsApp</span></span>
        </a>
      </li>
      <li>
        <a class="item" href="https://www.linkedin.com/in/divyansh-a-052a8b26b/" target="_blank" rel="noopener">
          <span class="icon">🔗</span>
          <span><span class="label">LinkedIn</span><span class="value">linkedin.com/in/divyansh-a-052a8b26b</span></span>
        </a>
      </li>
    </ul>

    <footer>© 2026 Divyansh Arora</footer>
  </main>
</body>
</html>
